services:
  frontend:
    build:
      context: ./frontend
    image: tefast-frontend
    container_name: tefast-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    image: tefast-backend
    container_name: tefast-backend
    command: sh -lc "bun run db:bootstrap && bun run start"
    ports:
      - "3001:3001"
    environment:
      APP_NAME: tefast-backend
      HOST: 0.0.0.0
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tefast
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres
    container_name: tefast-postgres
    environment:
      POSTGRES_DB: tefast
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tefast"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql

  redis:
    image: redis
    container_name: tefast-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
